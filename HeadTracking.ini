; Prey Head Tracking - configuration
; Sits next to Prey.exe in Binaries\Danielle\x64\Release\ alongside
; PreyHeadTracking.asi. Section/key names match the parser exactly (the reader
; is case-insensitive).

[Network]
; UDP port the OpenTrack-compatible tracker sends to. Default 4242.
; Must be 1024-65535; anything else is ignored and the default is used.
UdpPort = 4242

[Tracking]
; Per-axis sensitivity. 1.0 = 1:1 with tracker.
YawSensitivity   = 1.0
PitchSensitivity = 1.0
RollSensitivity  = 1.0

; Per-axis inversion. Tune these in-game if an axis moves the wrong way.
InvertYaw   = false
InvertPitch = false
InvertRoll  = false

; Deadzone in degrees (applied to all axes). 0 = off.
Deadzone = 0.0

; Smoothing is picked per connection from the tracker's source address, and
; covers both rotation and position. 0 = no smoothing, 1 = heavy.
; LocalSmoothing applies when the tracker runs on this machine (loopback).
LocalSmoothing  = 0.0
; RemoteSmoothing applies when the tracker is a remote device on the network.
RemoteSmoothing = 0.15

[Hotkeys]
; Win32 VK names (or a numeric VK like 0x22). Ctrl+Shift+Y/G/H chord
; alternatives are baked into the hotkey poller for keyboards without a nav
; cluster.
ToggleKey   = End
YawModeKey  = PageDown
; Cycles the DOF mode: 6DOF (rotation + position) -> 3DOF rotation only ->
; 3DOF position only -> back to 6DOF.
PositionKey = PageUp

[Camera]
; Yaw axis. true (default) = horizon-locked: head-yaw rotates around the world
; up-axis regardless of camera pitch ("up" stays constant). false = camera-local:
; head-yaw rotates around the camera's current up-axis, which leans/rolls the view
; at extreme pitch. Toggle live in-game with PageDown (or Ctrl+Shift+H).
WorldSpaceYaw = true
; ...except in the space suit, where it is always head-relative: out there you
; float at any angle, so the world's up axis has nothing to do with your head.

; Move Prey's own crosshair to the spot in the head-tracked view that your
; mouse-controlled aim points at, so your shots land where the crosshair is
; drawn. Covers leaning too: the aim ray is cast through the game's physics each
; frame, so the crosshair holds its spot at any range. Prey's interaction prompt
; is drawn at the crosshair and follows it. false pins the crosshair to its usual
; place instead.
CompensateReticle = true

; Project the world-anchored HUD markers (objective markers, interactable
; diamonds) through the head-tracked view so they stay on their objects. false
; leaves them where they would be if you were looking straight ahead.
CompensateMarkers = true

; Horizontal field of view, in degrees. 0 (default) leaves Prey's own Field of
; View slider in charge and changes nothing.
;
; Prey already has a slider and the cl_hfov / cl_fov console pair behind it, and
; both are clamped to 120 degrees. This key writes the same two values straight
; into the engine, which skips that clamp, and holds them every frame - so while
; it is set, moving the in-game slider has no effect until you set this back to
; 0. The crosshair compensation reads the field of view back off the live camera,
; so it follows whatever you put here.
;
; Accepted range 25 to 170.
FieldOfView = 0

; Draw the gun in your hands through the same lens as the world.
;
; Prey renders held weapons and hands in a separate pass with its own field of
; view (r_DrawNearFoV), fixed at the vertical equivalent of the default Field of
; View slider on a 16:9 display. Raise the slider and the world widens while the
; weapon keeps the narrow lens, so the weapon is magnified. Nothing shows that
; while the view and the gun turn together - but head tracking leaves the gun on
; your body while the view turns, and the magnified gun then sweeps further
; across the screen than the world behind it. At the maximum slider on 16:9 it
; travels 1.87 times as far, so the barrel points well off the crosshair even
; though the shot still lands on it.
;
; true (default) holds the weapon's field of view equal to the world's. At the
; default slider the two already match and this changes nothing; above it, the
; gun is drawn smaller and with more perspective, which is the price of the
; barrel and the crosshair agreeing. false leaves Prey's value alone.
MatchWeaponFieldOfView = true

; Diagnostic (read-only): once hooked, log the view-camera matrix and the
; crosshair projection periodically so the layout can be confirmed in-game.
; Leave off for normal play.
DumpCamera = false

; Inject the head pose when the game sets the view camera rather than only for
; the render, so the culling and the HUD see it too. Without this, geometry is
; culled out of the view when you turn your head.
EarlyInject = true

; Turn off Prey's software occlusion culling. It is built from a camera the mod
; cannot reach, so it culls the head-turned view against the un-turned one and
; geometry vanishes at the edge of a head turn.
DisableCoverageBuffer = true

; Take charge of the camera the player's own first-person body is built from.
; Prey builds its render object from the view camera and then renders through
; that camera again, so without this the body swings across the screen at twice
; your head's rotation.
CompensateBody = true

; Carry your own first-person body with your head while it is drawn.
;
; The exterior sections put you in a space suit whose collar and shoulders fill
; the bottom of the screen. Without this they stay facing where your character is
; facing, so turning your head looks ACROSS the inside of the suit instead of
; turning inside it. With it, the suit turns with you the way a helmet does.
;
; Prey draws the item in your hands as part of the same object, so it follows
; your head too. In the suit that is a fair trade; on foot it would leave the
; barrel pointing away from the crosshair your shot goes to. So this only ever
; applies while the suit is on, which the mod reads off the body itself: its
; origin sits at chest height while you float in the suit and at floor height
; while you walk. Delete, or Ctrl+Shift+J, turns the whole thing off in game.
BodyFollowsHead = true

; Diagnostic: sample the camera-space render node your body is drawn from, with
; the offset it is placed from. Off for play.
TraceBodyNodes = false

; Diagnostic: draw nothing for that node. Whatever vanishes is what it places,
; and a shot of the world without it subtracts to the body's exact silhouette.
HideBodyNodes = false

; Diagnostic: force the flashlight on regardless of save progress.
ForceFlashlight = false

; Turn the flashlight beam with your head. It turns further than the view does,
; because when you turn your head your eyes end up past the centre of the
; screen, and a beam matched to the view alone lands short of what you are
; looking at. 1.0 = matches the view exactly, 0 leaves it where the game put it.
; Needs EarlyInject = true: that is the point in the frame the beam can still be
; turned from.
CompensateFlashlight = true
FlashlightScale = 1.5

; Diagnostic: log each distinct dynamic light once.
TraceLights = false

; Diagnostic: report every instruction that reads the flashlight's intensity.
; Whatever reads it each frame is the code that submits the light, which is the
; code that decides where the beam points. Off for play.
TraceLightReader = false


; Diagnostic: log every distinct caller of the engine's view-camera getter
; once, as an RVA. Off for play.
TraceCameraReaders = false

; Diagnostic: RVA of one view-camera reader to hand the clean camera to.
CleanCameraForReader = 0
; Upper bound of the reader RVA range, for bisecting. 0 = exact match.
CleanCameraReaderEnd = 0

[Position]
; 6DOF positional tracking. Decoupled exactly like rotation: the head offset is
; added to the rendered camera position only. PageUp (or Ctrl+Shift+G) cycles
; 6DOF -> rotation-only -> position-only. Enabled here is the startup state.
Enabled = true

; Per-axis sensitivity (1.0 = 1:1 with tracker). X = sway (left/right),
; Y = heave (up/down), Z = surge (forward/back).
SensitivityX = 1.0
SensitivityY = 1.0
SensitivityZ = 1.0

; Per-axis inversion.
InvertX = false
InvertY = false
InvertZ = false

; Travel limits in meters. Z is asymmetric: more range forward (LimitZ) than
; backward (LimitZBack) so leaning back does not clip through the player.
LimitX     = 0.30
LimitY     = 0.20
LimitZ     = 0.40
LimitZBack = 0.10

; Cancels the camera swing that comes from turning your head rather than moving
; it. A tracker watches a point on your face, and your head swings that point
; around a pivot in your neck, so pitching up on its own reports several
; centimetres of "movement" you never made. Pitch has the longest lever, which is
; why it is the axis that misbehaves while yaw and roll look fine.
;
; These two numbers are the distance in metres from that neck pivot to the point
; your tracker watches: PivotForward towards your face, PivotUp above the pivot.
; 0 (default) leaves the correction off, which is right for a tracker app that
; already does this itself.
;
; If pitching your head up walks the camera backwards out of your character, turn
; it on. Start at PivotForward = 0.10, PivotUp = 0.03 - roughly eye-to-neck on an
; adult - and raise PivotForward until the swing stops. If the camera starts
; swinging the OTHER way, you have gone too far.
PivotForward = 0.0
PivotUp      = 0.0

; Position uses the same [Tracking] LocalSmoothing / RemoteSmoothing values as
; rotation.

[Logging]
; The log is written next to Prey.exe and starts empty on every launch, so what
; you send is one session. The previous session is kept alongside it as
; HeadTracking.prev.log - that is the one to send after a crash.
LogToFile = true
LogPath   = HeadTracking.log
